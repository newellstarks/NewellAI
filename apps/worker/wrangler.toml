# NewellAI Worker — authenticated ingest + D1 persistence.
name = "newellai-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Desktop Recall v1 static UI (served under /recall/ by the Worker).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "newellai"
database_id = "REPLACE_ME" # npx wrangler d1 create newellai
migrations_dir = "../../migrations"
